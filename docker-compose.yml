version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.10.4
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexgOOhDZni1UkKD3NmZj92RVWM3xcCg=
      - AIRFLOW_DB_UPGRADE=true
      - AIRFLOW_WWW_USER_CREATE=true
      - AIRFLOW_WWW_USER_USERNAME=admin
      - AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW_WWW_USER_ROLE=Admin
      - AIRFLOW_WWW_USER_EMAIL=salih@hacettepe.edu.tr
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mongo==4.1.0 faker apache-airflow-providers-postgres
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Salih --lastname Karayilan --role Admin --email salih@hacettepe.edu.tr --password admin"

  webserver:
    image: apache/airflow:2.10.4
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexgOOhDZni1UkKD3NmZj92RVWM3xcCg=
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mongo==4.1.0 faker apache-airflow-providers-postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      - airflow-init

  scheduler:
    image: apache/airflow:2.10.4
    container_name: airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexgOOhDZni1UkKD3NmZj92RVWM3xcCg=
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mongo==4.1.0 faker apache-airflow-providers-postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      - airflow-init

volumes:
  postgres_data: